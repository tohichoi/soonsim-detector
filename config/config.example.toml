# =============================================================================
# Soonsim Detector 설정 파일 (템플릿)
#
# 사용법:
#   cp config/config.example.toml config/config.toml
#   그 뒤 config/config.toml 을 열어 아래 값들을 채웁니다.
#
# ※ config.toml 은 .gitignore 로 제외되어 있습니다. 실제 비밀번호/토큰을 넣어도
#    저장소에 올라가지 않습니다. 반대로 이 템플릿 파일에는 절대 실제 값을 넣지 마세요.
#
# ※ 값을 바꾼 뒤 NAS에 반영하려면:
#      ./scripts/reload_config.sh      (설정만 바꿨을 때, 약 2초)
#      ./scripts/deploy.sh             (코드까지 바뀌었을 때, 전체 재빌드)
# =============================================================================


[camera]
# 카메라 영상 주소입니다. 두 가지를 넣을 수 있습니다.
#   1) RTSP 주소  : "rtsp://아이디:비밀번호@카메라IP:554/stream2"
#   2) 로컬 파일  : "./sample.mp4"  (카메라 없이 테스트할 때)
#
# Tapo C100 기준 stream1 = 고화질, stream2 = 저화질(640x360)입니다.
# 이 시스템은 stream2(서브스트림) 사용을 전제로 만들어졌습니다. stream1 로 바꾸면
# 해상도가 커져서 NAS CPU 사용량이 크게 올라갑니다.
source = "rtsp://admin:password@192.168.0.100:554/stream2"

# 초당 처리할 프레임 수입니다. 카메라 서브스트림과 같은 15를 권장합니다.
# 높이면 더 촘촘히 보지만 CPU를 그만큼 더 씁니다. 낮추면 CPU는 줄지만
# 순심이가 아주 잠깐 스쳐 지나가는 순간을 놓칠 수 있습니다.
fps = 15

# 영상 연결이 끊겼을 때 몇 초 뒤에 다시 연결을 시도할지 정합니다.
# 공유기가 불안정하면 5~10 정도로 늘리면 재연결 폭주를 막을 수 있습니다.
reconnect_interval_sec = 3.0


[zone]
# 배변판(감시 영역)의 네 모서리 좌표입니다. [x, y] 형식이며 단위는 픽셀입니다.
# 기준 해상도는 640x360 입니다. (좌상단이 0,0 / 우하단이 640,360)
#
# 반드시 시계 방향 또는 반시계 방향으로 네 점을 순서대로 나열해야 합니다.
# 순서가 엉키면 다각형이 꼬여서 영역이 제대로 인식되지 않습니다.
#
# 좌표를 손으로 맞추기 어려우므로 아래 도구로 화면을 보며 찍는 것을 권장합니다:
#   uv run python -m src.cli.calibrate
polygon = [
    [180, 140],   # 좌상단
    [460, 140],   # 우상단
    [460, 330],   # 우하단
    [180, 330],   # 좌하단
]


[detector]
# 사용할 인공지능 모델 파일 이름입니다.
#   yolov8n.pt = 가장 가볍고 빠름 (기본값, NAS에 적합)
#   yolov8s.pt / yolov8m.pt = 더 정확하지만 그만큼 무겁고 느림
# 파일이 없으면 처음 실행할 때 자동으로 내려받습니다.
model_name = "yolov8n.pt"

# 인공지능이 "이건 강아지다"라고 확신하는 최소 기준입니다. (0.0 ~ 1.0)
#   낮추면  → 잘 잡아내지만 엉뚱한 것도 강아지로 오인합니다.
#   높이면  → 오인은 줄지만 진짜 강아지를 놓칠 수 있습니다.
# 참고: 0.22 같은 낮은 확신도로 배변판을 잘못 잡는 장면이 실제로 있었습니다.
# 너무 낮추기 전에 아래 animal_class_ids 필터가 함께 동작한다는 점을 기억하세요.
# 허용 범위 0.1 ~ 1.0.
confidence_threshold = 0.30

# 인공지능이 찾아낼 동물 종류 번호입니다. (COCO 데이터셋 기준)
#   15 = 고양이,  16 = 강아지
# 강아지만 잡으려면 [16] 으로 줄여도 됩니다. 다만 흰색 소형견은 고양이로
# 오인되는 경우가 있어, 기본값은 둘 다 잡도록 [15, 16] 으로 두었습니다.
animal_class_ids = [15, 16]

# 추적을 시작할 최소 확신도입니다. 이 값보다 낮은 감지는 새로운 개체로 세지 않습니다.
# 낮추면 빨리 따라붙지만 잡음도 함께 추적 대상이 됩니다.
track_thresh = 0.20

# 같은 강아지인지 판단해 이어 붙이는 기준입니다. 높일수록 깐깐하게 봅니다.
# 너무 높이면 한 마리를 여러 마리로 쪼개 세고, 너무 낮추면 다른 개체를 하나로 합칩니다.
match_thresh = 0.8

# 몇 프레임마다 인공지능을 돌릴지 정합니다. (1 = 매 프레임)
# 15fps 에서 3으로 두면 초당 약 5회 추론합니다.
# 이 값을 키우면 CPU는 줄지만 아주 짧은 진입을 놓칠 수 있습니다.
# 움직임이 감지된 프레임에만 적용되므로, 평소 절전은 아래 motion_gate 가 담당합니다.
# 허용 범위 1 ~ 30. 30 을 넘기면 설정 파일이 아예 읽히지 않아 서비스가 뜨지 않습니다.
inference_interval_frames = 5

# 절전 모드 사용 여부입니다. (권장: true)
#   true  → 화면에 움직임이 없으면 인공지능을 아예 돌리지 않습니다. (평상시 CPU 1% 미만)
#   false → 움직임과 무관하게 계속 추론합니다. CPU 사용량이 크게 올라갑니다.
motion_gate_enabled = true

# "움직임이 있다"고 판단하는 기준입니다. (프레임 간 밝기 차이 평균, 0 ~ 255)
#   낮추면  → 민감해집니다. 미세한 움직임도 잡지만, 전등을 켜고 끄는 것 같은
#             밝기 변화에도 반응합니다. (이 프로젝트가 해결하려는 바로 그 문제)
#   높이면  → 확실한 움직임에만 반응합니다. 조명 변화에는 강해지지만
#             가만히 앉아 있는 강아지를 놓칠 수 있습니다.
# 허용 범위 0.5 ~ 50.0.
motion_threshold = 4.0

# 안전장치입니다. 움직임이 전혀 없어도 이 시간(초)마다 강제로 한 번 추론합니다.
# 강아지가 배변판 위에서 거의 움직이지 않으면 절전 모드가 계속 켜져 있을 수 있어,
# 이를 막기 위한 주기적 확인입니다. 낮추면 더 안전하지만 CPU를 더 씁니다.
failsafe_interval_sec = 30.0

# 인공지능 연산에 쓸 CPU 코어 수입니다.
# 시놀로지 DS923+ 처럼 코어가 적은 장비에서는 2 를 권장합니다.
# 값을 올리면 다른 서비스가 느려질 수 있으니 코어 수를 넘기지 마세요.
max_threads = 2


[recorder]
# 사건이 시작되기 "몇 초 전"부터 영상에 담을지 정합니다.
# 순심이가 올라오는 동작을 보여주기 위한 앞부분입니다.
pre_buffer_sec = 5

# 강아지가 배변판을 떠난 "뒤 몇 초"까지 영상에 담을지 정합니다.
# 결과를 확인하기 위한 뒷부분입니다.
post_buffer_sec = 5

# 완성된 MP4 영상을 저장할 폴더입니다. (프로젝트 폴더 기준 상대 경로)
output_dir = "./records"

# 이 시간(초) 이상 머물렀을 때만 진짜 사건으로 인정합니다.
# 이보다 짧으면 영상을 만들지 않습니다. 지나가듯 스치는 것을 걸러내는 값입니다.
min_stay_duration_sec = 1.0


[telegram]
# 텔레그램으로 영상을 보낼지 여부입니다.
# 이 값이 true 여도 아래 bot_token 과 chat_id 가 비어 있으면 전송하지 않고,
# 로그에만 남기는 "연습 모드"로 동작합니다. (안전하니 걱정하지 않으셔도 됩니다)
enabled = false

# 텔레그램 봇 토큰입니다. 텔레그램에서 @BotFather 에게 /newbot 을 보내 발급받습니다.
bot_token = "YOUR_TELEGRAM_BOT_TOKEN_HERE"

# 영상을 받을 대화방 번호입니다. @userinfobot 에게 말을 걸면 확인할 수 있습니다.
chat_id = "YOUR_TELEGRAM_CHAT_ID_HERE"


[viewer]
# 웹 감시 화면을 켤지 여부입니다. 감시 프로그램과 같은 프로세스에서 함께 실행됩니다.
enabled = true

# 접속을 허용할 주소입니다. 0.0.0.0 은 "이 컴퓨터의 모든 네트워크"를 뜻합니다.
# 집 안에서만 쓰려면 "192.168.45.63" 처럼 특정 주소로 좁힐 수 있습니다.
host = "0.0.0.0"

# 웹 화면 포트 번호입니다. 이미 쓰이는 포트면 최대 100번까지 자동으로 다음 번호를 찾습니다.
port = 8080

# 웹 화면 잠금을 풀 때 입력하는 비밀번호입니다.
# 외부에 공개되는 화면이므로 반드시 다른 값으로 바꾸세요.
# 4자리처럼 짧으면 무차별 대입에 약합니다. 연속 5회 틀리면 5분간 잠기지만,
# PIN 자체를 길게 잡는 편이 더 안전합니다.
pin = "CHANGE_ME"

# 로그인 세션은 서버 메모리에만 보관되며, 프로그램을 다시 시작하면 모두 사라집니다.
# (배포 후 다시 로그인해야 하는 이유입니다. 별도로 설정할 값은 없습니다.)

# 웹 화면에서 최근 기록을 몇 초 동안 보관할지 정합니다.
# 1800 = 30분. 이 시간이 지난 사진은 목록에서 사라집니다.
retention_sec = 1800.0


[logging]
# 로그 출력 수준입니다. DEBUG / INFO / WARNING / ERROR
# 평소에는 INFO 를 권장합니다. DEBUG 는 매 프레임 정보를 쏟아내 로그가 매우 커집니다.
level = "INFO"
