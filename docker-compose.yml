services:
  soonsim-detector:
    image: soonsim-detector:latest
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: soonsim-detector
    restart: unless-stopped
    network_mode: "host"
    command: ["uv", "run", "python", "-m", "src.main", "--no-dashboard"]
    volumes:
      - ./config/config.toml:/app/config/config.toml:ro
      - ./src:/app/src:ro
      - ./records:/app/records:rw
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Seoul
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ngrok:
    image: ngrok/ngrok:latest
    container_name: soonsim-ngrok
    restart: unless-stopped
    network_mode: "host"
    # NGROK_AUTHTOKEN lives in .env (gitignored) so it never lands in a tracked
    # file again — it is already in this repo's history once and had to be rotated.
    env_file:
      - .env
    command:
      - "http"
      - "--url=blend-replay-canary.ngrok-free.dev"
      - "8080"
    depends_on:
      - soonsim-detector
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
